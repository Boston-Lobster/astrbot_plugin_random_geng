name: Test and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: random-geng-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/package_release.py --version

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package release
        run: python scripts/package_release.py
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(python scripts/package_release.py --version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub release; skipping."
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}" >/dev/null 2>&1; then
            echo "$tag already exists; skipping to preserve the existing tag."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --notes-file dist/release-notes.md dist/*.zip dist/SHA256SUMS
